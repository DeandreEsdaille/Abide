name: Build Abide Logic AU and Windows VST3
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/photo-edition.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and enable Logic Audio Unit
        shell: python
        run: |
          import pathlib, hashlib, zipfile, io
          parts = sorted(pathlib.Path('.').glob('AbidePhotoSource.zip.part*'))
          assert len(parts) == 4, 'Missing build source parts'
          data = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest() == '1105faba8d40ce5d4f52d3c26dec29d1f153e4526ad876d4951d051179f37690', 'Source checksum mismatch'
          zipfile.ZipFile(io.BytesIO(data)).extractall('photo-edition')
          root = pathlib.Path('photo-edition')
          for name in ['CMakeLists.txt', 'scripts/build-windows.ps1', 'scripts/Abide.iss']:
              p = root / name
              p.write_text(p.read_text(encoding='utf-8-sig').replace('0.4.0','0.5.0'), encoding='utf-8')
          p = root / 'CMakeLists.txt'
          text = p.read_text()
          text = text.replace('juce_add_plugin(Abide', 'if(APPLE)\n set(ABIDE_FORMATS AU)\nelse()\n set(ABIDE_FORMATS VST3 Standalone)\nendif()\njuce_add_plugin(Abide')
          text = text.replace('FALSE FORMATS VST3 Standalone', 'FALSE FORMATS ${ABIDE_FORMATS} AU_MAIN_TYPE kAudioUnitType_MusicDevice')
          p.write_text(text)
      - name: Build and test Mac Universal AU
        if: runner.os == 'macOS'
        run: |
          cd photo-edition
          cmake -S . -B build-mac -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          cmake --build build-mac --config Release --parallel 2
          ctest --test-dir build-mac -C Release --output-on-failure
          mkdir -p dist/mac-root/Library/Audio/Plug-Ins/Components
          ditto build-mac/Abide_artefacts/Release/AU/Abide.component dist/mac-root/Library/Audio/Plug-Ins/Components/Abide.component
          codesign --force --deep --sign - dist/mac-root/Library/Audio/Plug-Ins/Components/Abide.component
          lipo dist/mac-root/Library/Audio/Plug-Ins/Components/Abide.component/Contents/MacOS/Abide -verify_arch arm64 x86_64
          sudo ditto dist/mac-root/Library/Audio/Plug-Ins/Components/Abide.component /Library/Audio/Plug-Ins/Components/Abide.component
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto dist/mac-root/Library/Audio/Plug-Ins/Components/Abide.component "$HOME/Library/Audio/Plug-Ins/Components/Abide.component"
          plutil -p "$HOME/Library/Audio/Plug-Ins/Components/Abide.component/Contents/Info.plist"
          killall AudioComponentRegistrar || true
          sleep 5
          /usr/bin/auval -a
          validated=0
          for attempt in 1 2 3; do
            if /usr/bin/auval -v aumu Abid GtJu; then validated=1; break; fi
            killall AudioComponentRegistrar || true
            sleep 5
          done
          test "$validated" = 1
          pkgbuild --root dist/mac-root --identifier com.gimmethatjuice.abide.au --version 0.5.0 --install-location / dist/Abide-0.5.0-macOS-Universal-AU.pkg
      - name: Build and test Windows VST3 installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path += ';C:\Program Files (x86)\Inno Setup 6'
          ./photo-edition/scripts/build-windows.ps1
      - name: Preserve compiled AU for diagnosis if validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Abide-0.5.0-AU-diagnostic
          path: photo-edition/build-mac/Abide_artefacts/Release/AU/Abide.component
      - uses: actions/upload-artifact@v4
        with:
          name: Abide-0.5.0-${{ runner.os }}
          path: |
            photo-edition/dist/*.pkg
            photo-edition/dist/*Setup.exe
          if-no-files-found: error
